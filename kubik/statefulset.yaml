---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lol-stateful
spec:
  serviceName: "lols-stateful"
  replicas: 2
  selector:
    matchLabels:
      app: lol
  template:
    metadata:
      labels:
        app: lol
    spec:
      containers:
        - name: app
          image: lol
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: superslon
          resources:
            limits:
              cpu: 10m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: config-volume
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: config-volume
          configMap:
            name: superslon
